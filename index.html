<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Comercial Ultralight</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#050505;
      color:white;
      overflow:hidden;
      transition:0.4s;
    }

    .container{
      display:flex;
      height:100vh;
      padding:25px;
      gap:25px;
    }

    .left,
    .right{
      width:24%;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .center{
      flex:1;
      background:#0d0d0d;
      border:2px solid #222;
      border-radius:25px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      position:relative;
      overflow:hidden;
    }

    .card{
      background:#0d0d0d;
      border:2px solid #222;
      border-radius:20px;
      padding:25px;
    }

    .card h2{
      margin-bottom:20px;
      font-size:28px;
    }

    .ranking-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px;
      border-radius:12px;
      margin-bottom:10px;
      background:rgba(255,255,255,0.04);
      font-size:22px;
    }

    .title{
      font-size:28px;
      color:#777;
      margin-bottom:20px;
    }

    .timer{
      font-size:140px;
      font-weight:bold;
      color:#00ff95;
      transition:0.3s;
    }

    .alert{
      color:red !important;
      animation:piscar 1s infinite;
    }

    @keyframes piscar{
      0%{opacity:1;}
      50%{opacity:0.3;}
      100%{opacity:1;}
    }

    .message{
      position:absolute;
      bottom:40px;
      font-size:52px;
      color:#999;
      text-align:center;
      width:100%;
      padding:0 40px;
      font-weight:bold;
    }

    .meta{
      font-size:60px;
      color:#00ff95;
      font-weight:bold;
    }

    hr{
      border-color:#222;
      margin:20px 0;
    }

    .button-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    button{
      padding:16px;
      border:none;
      border-radius:12px;
      background:#00ff95;
      color:black;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
      font-size:18px;
    }

    button:hover{
      transform:scale(1.03);
    }

    .danger{
      background:red;
      color:white;
    }

    .warning{
      background:#ffae00;
      color:black;
    }

    .mini{
      font-size:16px;
      padding:14px;
    }

    .edit-input{
      width:90px;
      height:42px;
      border:none;
      border-radius:10px;
      background:#111;
      color:#00ff95;
      text-align:center;
      font-size:20px;
      font-weight:bold;
      outline:none;
    }

    .title-input{
      width:260px;
      background:transparent;
      border:none;
      color:white;
      font-size:28px;
      font-weight:bold;
      outline:none;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- ESQUERDA -->
  <div class="left">

    <div class="card">

      <h2>🏆 Ranking Diário</h2>

      <div id="rankingDiario"></div>

      <hr>

      <h2>

        💰

        <input
          type="text"
          id="tituloPercentual"
          class="title-input"
          value="% de Vendas"
          oninput="salvarTitulo()"
        >

      </h2>

      <div class="ranking-item">

        <span>
          Controle de Pragas
        </span>

        <input
          type="number"
          id="controlePragasInput"
          class="edit-input"
          min="0"
          value="0"
          oninput="salvarPercentual()"
        />

      </div>

    </div>

  </div>

  <!-- CENTRO -->
  <div class="center">

    <div class="title">
      TEMPO SEM LIGAÇÃO
    </div>

    <div class="timer" id="timer">
      00:00
    </div>

    <div class="message" id="message">
      Os clientes não vão ligar sozinhos.
    </div>

  </div>

  <!-- DIREITA -->
  <div class="right">

    <div class="card">
      <h2>📞 Ligações Hoje</h2>
      <div class="meta" id="totalLigacoes">0</div>
    </div>

    <div class="card">
      <h2>🎯 Meta</h2>
      <div class="meta">50</div>
    </div>

    <div class="card">

      <h2>🎮 Controle</h2>

      <div class="button-grid">

        <button onclick="addLigacao('Solange')">
          Sol
        </button>

        <button onclick="addLigacao('Lucas')">
          Lucas
        </button>

        <button onclick="addLigacao('Patrick')">
          Patrick
        </button>

        <button onclick="addLigacao('Bruna')">
          Bruna
        </button>

        <button onclick="addLigacao('Nayara')">
          Nayara
        </button>

        <button onclick="addLigacao('Enrico')">
          Enrico
        </button>

        <button class="warning" onclick="adicionarTempo()">
          +
        </button>

        <button class="warning" onclick="tirarTempo()">
          -
        </button>

        <button class="danger mini" onclick="resetTimer()">
          Timer
        </button>

        <button class="danger mini" onclick="resetRanking()">
          Diário
        </button>

      </div>

    </div>

  </div>

</div>

<audio id="alertSound">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>

let frases = [

  "Doeu ligar para o cliente?",
  "O telefone não morde.",
  "Os clientes não vão ligar sozinhos.",
  "Silêncio demais pra equipe comercial.",
  "A meta não bate sozinha.",
  "Call center ou biblioteca?",
  "Mais uma ligação = mais chance de venda.",
  "O teclado não fecha venda.",
  "Sem ligação sem comissão 👀",
  "Vendedor raiz gosta de ligação."

];

let vendedores =
  JSON.parse(localStorage.getItem("vendedores")) || {};

if(!vendedores["Solange"]){
  vendedores["Solange"] = { diario:0 };
}

if(!vendedores["Lucas"]){
  vendedores["Lucas"] = { diario:0 };
}

if(!vendedores["Patrick"]){
  vendedores["Patrick"] = { diario:0 };
}

if(!vendedores["Bruna"]){
  vendedores["Bruna"] = { diario:0 };
}

if(!vendedores["Nayara"]){
  vendedores["Nayara"] = { diario:0 };
}

if(!vendedores["Enrico"]){
  vendedores["Enrico"] = { diario:0 };
}

let totalLigacoes =
  parseInt(localStorage.getItem("totalLigacoes")) || 0;

let segundos =
  parseInt(localStorage.getItem("segundos")) || 0;

let percentualControle =
  parseInt(localStorage.getItem("percentualControle")) || 0;

let tituloPercentual =
  localStorage.getItem("tituloPercentual") || "% de Vendas";

document.getElementById("totalLigacoes")
  .innerText = totalLigacoes;

document.getElementById("controlePragasInput")
  .value = percentualControle;

document.getElementById("tituloPercentual")
  .value = tituloPercentual;

function salvarDados(){

  localStorage.setItem(
    "vendedores",
    JSON.stringify(vendedores)
  );

  localStorage.setItem(
    "totalLigacoes",
    totalLigacoes
  );

  localStorage.setItem(
    "segundos",
    segundos
  );

}

function salvarPercentual(){

  let valor =
    document.getElementById("controlePragasInput").value;

  localStorage.setItem(
    "percentualControle",
    valor
  );

}

function salvarTitulo(){

  let valor =
    document.getElementById("tituloPercentual").value;

  localStorage.setItem(
    "tituloPercentual",
    valor
  );

}

function atualizarTimerVisual(){

  let min = Math.floor(segundos / 60);
  let sec = segundos % 60;

  if(min < 10) min = "0" + min;
  if(sec < 10) sec = "0" + sec;

  document.getElementById("timer").innerText =
    `${min}:${sec}`;

  if(segundos >= 1200){

    document.getElementById("timer")
      .classList.add("alert");

    document.body.style.background = "#250000";

    document.getElementById("message").innerText =
      "⚠ SEM LIGAÇÕES HÁ 20 MINUTOS ⚠";

    document.getElementById("alertSound").play();

  }

  else{

    document.body.style.background = "#050505";

    document.getElementById("timer")
      .classList.remove("alert");

  }

}

function atualizarTimer(){

  segundos++;

  atualizarTimerVisual();

  salvarDados();

}

setInterval(atualizarTimer,1000);

function atualizarRanking(){

  let diario = Object.entries(vendedores)

    .sort((a,b) => b[1].diario - a[1].diario);

  let htmlDiario = "";

  diario.forEach((vendedor,index)=>{

    htmlDiario += `

      <div class="ranking-item">
        <span>${index + 1}. ${vendedor[0]}</span>
        <span>${vendedor[1].diario}</span>
      </div>

    `;

  });

  document.getElementById("rankingDiario")
    .innerHTML = htmlDiario;

}

atualizarRanking();
atualizarTimerVisual();

function fraseAleatoria(){

  let frase =
    frases[Math.floor(Math.random() * frases.length)];

  document.getElementById("message").innerText =
    frase;

}

function addLigacao(nome){

  vendedores[nome].diario++;

  totalLigacoes++;

  document.getElementById("totalLigacoes")
    .innerText = totalLigacoes;

  atualizarRanking();

  fraseAleatoria();

  resetTimer();

  salvarDados();

}

function adicionarTempo(){

  segundos += 60;

  atualizarTimerVisual();

  salvarDados();

}

function tirarTempo(){

  segundos -= 60;

  if(segundos < 0){
    segundos = 0;
  }

  atualizarTimerVisual();

  salvarDados();

}

function resetTimer(){

  segundos = 0;

  atualizarTimerVisual();

  salvarDados();

}

function resetRanking(){

  for(let nome in vendedores){

    vendedores[nome].diario = 0;

  }

  totalLigacoes = 0;

  document.getElementById("totalLigacoes")
    .innerText = 0;

  atualizarRanking();

  salvarDados();

}

</script>

</body>
</html>
