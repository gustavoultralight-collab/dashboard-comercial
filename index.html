<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#050505;
  color:white;
  overflow:hidden;
}

/* CONTAINER PRINCIPAL */
.container{
  display:flex;
  height:100vh;
  padding:12px;
  gap:12px;
}

/* LATERAIS */
.left,
.right{
  width:30%;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* CENTRO */
.center{
  flex:1;
  background:#0d0d0d;
  border:2px solid #222;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
  padding:10px;
}

/* CARDS */
.card{
  background:#0d0d0d;
  border:2px solid #222;
  border-radius:14px;
  padding:12px;
  overflow:hidden;
}

.card h2{
  font-size:18px;
  margin-bottom:10px;
}

/* RANKING SCROLL */
#rankingDiario,
#rankingMensal{
  max-height:35vh;
  overflow-y:auto;
}

/* ITEM RANKING */
.ranking-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
  background:rgba(255,255,255,0.04);
  font-size:14px;
}

/* TIMER */
.title{
  font-size:18px;
  color:#777;
  margin-bottom:10px;
}

.timer{
  font-size:64px;
  font-weight:bold;
  color:#00ff95;
}

.alert{
  color:red !important;
  animation:piscar 1s infinite;
}

@keyframes piscar{
  0%{opacity:1;}
  50%{opacity:0.3;}
  100%{opacity:1;}
}

/* MENSAGEM */
.message{
  position:absolute;
  bottom:20px;
  font-size:14px;
  color:#999;
  text-align:center;
  width:100%;
  padding:0 10px;
}

/* META */
.meta{
  font-size:28px;
  color:#00ff95;
  font-weight:bold;
}

/* BOTÕES */
.button-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#00ff95;
  color:black;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

button:active{
  transform:scale(0.95);
}

.danger{
  background:red;
  color:white;
}

.warning{
  background:#ffae00;
  color:black;
}

.mini{
  font-size:12px;
  padding:10px;
}

/* 🔥 MODO CELULAR VERTICAL (IMPORTANTE) */
@media (max-width: 900px){

  body{
    overflow:auto;
  }

  .container{
    flex-direction:column;
    height:auto;
  }

  .left,
  .right{
    width:100%;
    flex-direction:row;
    overflow-x:auto;
  }

  .card{
    min-width:260px;
  }

  .center{
    min-height:40vh;
  }

  .timer{
    font-size:70px;
  }

}

</style>
